<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuxt Spec Test Report - {{TIMESTAMP}}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f5f5; color: #222; }
  h1 { font-size: 1.4rem; }
  .summary { font-weight: 700; font-size: 18px; }
  .summary.passed { color: #0b0; }
  .summary.failed { color: #b00; }
  .failure { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
  .failure h2 { font-size: 1rem; margin: 0 0 .25rem; }
  .failure .location { color: #666; font-size: .8rem; margin: 0 0 .75rem; }
  .failure pre { white-space: pre-wrap; word-break: break-word; font-size: .8rem; margin: 0 0 .75rem; padding: .5rem; background: #fafafa; border: 1px solid #eee; border-radius: 4px; }
  .failure pre.message { color: #b00; }
  .failure details summary { cursor: pointer; font-size: .8rem; margin-bottom: .25rem; }
  .screenshot { margin-top: .75rem; }
  .screenshot h3 { font-size: .9rem; margin: 0 0 .25rem; }
  .screenshot .message { color: #b00; font-size: .85rem; margin: 0 0 .75rem; }
  .pair { display: flex; gap: 1rem; flex-wrap: wrap; }
  .pair figure { margin: 0; flex: 1 1 0; min-width: 240px; }
  .pair figcaption { font-size: .8rem; margin-bottom: .25rem; font-weight: bold; }
  .pair figure:first-child figcaption { color: #0b0; }
  .pair figure:last-child figcaption { color: #b00; }
  .pair img { max-width: 100%; background: #fff; }
  .pair figure:first-child img { border: 2px solid #0b0; }
  .pair figure:last-child img { border: 2px solid #b00; }
</style>
</head>
<body>
<h1>Nuxt Spec Test Report - {{TIMESTAMP}}</h1>
<p class="summary {{STATUS}}">{{SUMMARY}}</p>
