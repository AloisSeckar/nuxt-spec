# settings for Nuxt & pnpm

packages:
  - .
  - cli
  - docs

# moved from .npmrc
# https://pnpm.io/settings/node-modules#shamefullyhoist
shamefullyHoist: true

# moved from package.json
# https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  # provides fallback repair of platform-specific Rust native engine
  'unrs-resolver': true
  # allows node-gyp build of associated native binaries from local sources
  # disabled because it would require an explicit opt-in
  '@parcel/watcher': false
  # optimization for CLI usage of 'esbuild'
  # disabled because its runtime resolves native binaries itself
  'esbuild': false

overrides:
  # use Vite 8
  'vite': '^8.3.0'
  # align playwright version
  'playwright': '~1.64.0'

# https://pnpm.io/settings/dependency-resolution#minimumreleaseageexclude
minimumReleaseAgeExclude:
  # build 2026-10-20@19:20:00 CEST
  - '@nuxt/devtools-assets@4.0.0-beta.7'
  - '@nuxt/devtools-kit@4.0.0-beta.7'
  - '@nuxt/devtools@4.0.0-beta.7'
